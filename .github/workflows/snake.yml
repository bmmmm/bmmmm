name: generate snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: generate terminal snake (dark + light)
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 .github/scripts/generate-snake.py
          --login "${{ github.repository_owner }}" --out dist

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
